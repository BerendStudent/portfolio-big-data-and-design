<!DOCTYPE html>
<html lang="en">
<head>
    <title>Safe Routing</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <iframe id="mapFrame" src="/static/berlin_map.html"></iframe>

    <button id="routeButton" class="fab">Route</button>
    <button id="report" class="fab">Report</button>
    <button id="resetMapButton" class="fab">Reset map</button>

    <dialog id="incidentDialog">
        <form method="POST" action="/add_point">
            <label>
                Latitude
                <input name="lat" required>
            </label>

            <label>
                Longitude
                <input name="lon" required>
            </label>

            <label>
                Description
                <input name="description" required>
            </label>

            <div class="dialog-actions">
                <button type="submit" class="submit" id="submitReport">Submit</button>
                <button type="button" class="cancel" id="closeIncident">Cancel</button>
            </div>
        </form>
    </dialog>

    <dialog id="routeDialog">
        <form onsubmit="return false;">
            <label>
                Start address
                <input id="startAddress" placeholder="Domplein 1, Utrecht">
            </label>

            <label>
                End address
                <input id="endAddress" placeholder="Utrecht Centraal">
            </label>

            <label>
                Avoid radius (meters)
                <input id="avoidRadius" value="100">
            </label>

            <label>
                Penalty multiplier
                <input id="penaltyMultiplier" value="5">
            </label>

            <div class="dialog-actions">
                <button id="startRoute" class="submit">Start route</button>
                <button type="button" class="cancel" id="closeRoute">Cancel</button>
            </div>

            <p id="routeStatus"></p>
        </form>
    </dialog>

    <script>
        const mapFrame = document.getElementById("mapFrame");

        const incidentDialog = document.getElementById("incidentDialog");
        document.getElementById("report").onclick = () => incidentDialog.showModal();
        document.getElementById("closeIncident").onclick = () => incidentDialog.close();
        document.getElementById("submitReport").onclick = () => incidentDialog.close();

        document.getElementById("resetMapButton").onclick = () => {
            fetch("/reset_map", { method: "POST" }).then(() => {
                mapFrame.src = "/static/berlin_map.html?t=" + Date.now();
            });
        };

        const routeDialog = document.getElementById("routeDialog");
        const routeStatus = document.getElementById("routeStatus");

        document.getElementById("routeButton").onclick = () => {
            routeStatus.textContent = "";
            routeDialog.showModal();
        };

        document.getElementById("closeRoute").onclick = () => routeDialog.close();

        document.getElementById("startRoute").onclick = async () => {
            routeStatus.textContent = "Calculating route… this may take ~45 seconds";

            const res = await fetch("/start_route", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    city_query: "Utrecht, Netherlands",
                    travel_mode: "bike",
                    start_address: startAddress.value,
                    end_address: endAddress.value,
                    avoid_radius_m: avoidRadius.value,
                    penalty_multiplier: penaltyMultiplier.value
                })
            });

            const { job_id } = await res.json();
            pollRoute(job_id);
        };

        function pollRoute(jobId) {
            const interval = setInterval(async () => {
                const res = await fetch(`/route_status/${jobId}`);
                const data = await res.json();

                if (data.status === "done") {
                    clearInterval(interval);
                    routeDialog.close();
                    mapFrame.src = "/static/route.html?t=" + Date.now();
                }

                if (data.status === "error") {
                    clearInterval(interval);
                    routeStatus.textContent = data.error;
                }
            }, 2000);
        }
    </script>

</body>
</html>
