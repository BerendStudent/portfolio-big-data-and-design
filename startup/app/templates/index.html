<!DOCTYPE html>
<html lang="en">
<head>
    <title>Main Page</title>
    <style>
        iframe {
            width: 100%;
            height: 500px;
            border: 1px solid #ccc;
        }

        dialog {
            padding: 1rem;
        }

        dialog input {
            display: block;
            margin-bottom: 0.5rem;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>Main Page</h1>

    <iframe id="mapFrame" src="/static/berlin_map.html"></iframe>

    <button id="report" type="button">Report incident</button>

    <dialog id="myDialog">
        <form method="POST" action="/add_point">
        <label>
            Latitude
            <input name="lat" required>
        </label>

        <label>
            Longitude
            <input name="lon" required>
        </label>

        <label>
            Description
            <input name="description" required>
        </label>

        <button type="submit">Submit</button>
        <button type="button" id="closeDialogBtn">Cancel</button>
        </form>
    </dialog>

    <button id="resetMapButton" type="button">Reset map</button>

    <script>
        const reportButton = document.getElementById('report');
        const closeButton = document.getElementById('closeDialogBtn');
        const dialog = document.getElementById('myDialog');

        reportButton.addEventListener('click', () => {
            dialog.showModal();
        });

        closeButton.addEventListener('click', () => {
            dialog.close();
        });

        function reloadMap() {
            const iframe = document.getElementById("mapFrame");
            iframe.src = "/static/berlin_map.html?t=" + Date.now();
        }

        document.getElementById("resetMapButton").addEventListener("click", () => {
            fetch("/reset_map", { method: "POST" })
            .then(() => reloadMap());
        });
    </script>

</body>
</html>
